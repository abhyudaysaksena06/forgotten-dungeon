<!doctype html>
<html><body style="margin:0;background:#1d1f24">
<canvas id="c" width="1600" height="700"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import { clone } from 'three/examples/jsm/utils/SkeletonUtils.js';
const q = new URLSearchParams(location.search);
const key = q.get('key'), frames = q.get('frames').split(',').map((f) => f.split(':')); // clip:time
const yaw = Number(q.get('yaw') ?? 0.5);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.toneMapping = THREE.AgXToneMapping;
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`/models/${key}.glb`);
const W = 1600 / frames.length, H = 700;
const cam = new THREE.PerspectiveCamera(35, W / H, 0.01, 100);
cam.position.set(Math.sin(yaw) * 5.2, 1.4, Math.cos(yaw) * 5.2); cam.lookAt(0, 0.95, 0);
renderer.setScissorTest(true);
frames.forEach(([clip, t], i) => {
  const s = new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.3));
  const d = new THREE.DirectionalLight(0xffffff, 2.5); d.position.set(3, 5, 4); s.add(d);
  const m = clone(g.scene); s.add(m);
  const grid = new THREE.GridHelper(4, 8, 0x555566, 0x333344); s.add(grid);
  if (clip !== 'rest') { const mixer = new THREE.AnimationMixer(m); const a = mixer.clipAction(g.animations.find((x) => x.name === clip)); a.play(); mixer.setTime(Number(t)); }
  renderer.setViewport(i * W, 0, W, H); renderer.setScissor(i * W, 0, W, H); renderer.render(s, cam);
});
window.done = true;
</script></body></html>
