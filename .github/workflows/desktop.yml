# Builds the desktop app for Windows and Mac. Run it from the Actions tab ("Run workflow"); the
# installers appear as downloadable artifacts on the run's page.
name: Desktop app
on: workflow_dispatch
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run ${{ matrix.target }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: forgotten-dungeon-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
