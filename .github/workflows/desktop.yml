# Builds the desktop app for Windows and Mac. Run it from the Actions tab ("Run workflow"); the
# installers are published on the repo's Releases page (runs on every push to main, or by hand).
name: Desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['client/**', 'server/**', 'desktop/**', 'scramble/quest-bugs.mjs', '.github/workflows/desktop.yml']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win-bugged
          - os: macos-latest
            target: mac-bugged
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run ${{ matrix.target }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: forgotten-dungeon-${{ matrix.target }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: The Forgotten Dungeon (desktop) — build ${{ github.run_number }}
          make_latest: true
          body: |
            **The Forgotten Dungeon** = the fixed game. **The Forgotten Dungeon (Bugged)** = every planted rune, practice profile (saves are not judged; build each team's own app with `node build.mjs --team teamNN`).
            **Windows**: download the `.exe` (double-click, no install; on the SmartScreen warning click *More info → Run anyway*).
            **Mac**: the `.dmg` (first launch: right-click the app → Open).
          files: out/**/*
